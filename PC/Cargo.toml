[package]
name = "streamer"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
eframe = "0.27"
egui = "0.27"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Capture & encoding
pipewire = "0.9"
ashpd = { version = "0.10", features = ["tokio"] }

# TLS
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

# Cryptography
openssl = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = "0.10"
pbkdf2 = "0.12"
hex = "0.4"
rand = "0.8"
base64 = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# mDNS
mdns-sd = "0.11"

# Utils
log = "0.4"
chrono = "0.4"
dirs = "5"
memchr = "2"
